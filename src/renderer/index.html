<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';">
  <title>ClipVault</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo">
        <span class="logo-icon">📋</span>
        <h1>ClipVault</h1>
      </div>
      <div class="actions">
        <button id="exportBtn" class="btn btn-secondary" title="Export as .txt">Export</button>
        <button id="settingsBtn" class="btn btn-secondary" title="Settings">⚙️</button>
        <button id="clearBtn" class="btn btn-danger" title="Clear All Clips">Clear All</button>
      </div>
    </header>

    <main class="content">
      <div id="clipList" class="clip-list">
        <!-- Rendered dynamically -->
      </div>
      <div id="emptyState" class="empty-state" style="display: none;">
        <p>No clips yet.</p>
        <span>Copy any text in any app to see it appear here!</span>
      </div>
    </main>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
