<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';">
  <title>Settings</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="settings-body">
  <header style="margin-bottom: 20px;">
    <h2 style="font-size: 16px; font-weight: 700;">ClipVault Settings</h2>
  </header>

  <div class="settings-group">
    <div class="settings-label">
      <h3>Native Notifications</h3>
      <p>Show system notification when copying a clip</p>
    </div>
    <input type="checkbox" id="notifToggle" style="transform: scale(1.3); cursor: pointer;">
  </div>

  <div style="margin-top: 30px; text-align: right;">
    <button id="closeBtn" class="btn btn-secondary">Done</button>
  </div>

  <script src="settings.js"></script>
</body>
</html>
